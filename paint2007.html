<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>paint2007</title>
    <!-- Your Custom Tab Icon -->
    <link rel="icon" type="image/png" href="ico.png">
    <style>
        body {
            background-color: #cbd9e9;
            font-family: sans-serif;
            margin: 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Top toolbar layout */
        .controls {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Pushes the logo to the far right */
            background: #eaf2fb;
            padding: 10px;
            border: 1px solid #abc1de;
            border-radius: 4px;
            max-width: 650px;
            box-sizing: border-box;
        }
        /* Left side buttons, slider & colors wrap */
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Sub-groups inside the toolbar */
        .tool-section {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* Tool selection buttons */
        button {
            padding: 6px 10px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #abc1de;
            background: #fff;
            border-radius: 3px;
            font-size: 12px;
        }
        button:hover {
            background: #ffdf9e;
            border-color: #e4a53a;
        }
        button.active {
            background: #fec261;
            border-color: #db8a11;
        }
        /* Brush Size Controller Section */
        .size-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #1e395b;
            font-weight: bold;
            gap: 2px;
        }
        .size-panel input {
            cursor: pointer;
            width: 70px;
        }
        /* Color selection panel */
        .palette {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border: 1px solid #7a94b8;
            cursor: pointer;
            border-radius: 2px;
        }
        .color-box:hover {
            transform: scale(1.1);
        }
        /* Custom Logo Styling */
        .app-logo {
            height: 32px;
            object-fit: contain;
            margin-left: 10px;
        }
        /* The Canvas sheet */
        canvas {
            background-color: white;
            border: 3px solid #3c4754;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            cursor: crosshair;
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="toolbar-left">
            <!-- Tools Group -->
            <div class="tool-section">
                <button id="btn-brush" class="active" onclick="setTool('brush')">🖌️ Brush</button>
                <button id="btn-bucket" onclick="setTool('bucket')">🪣 Bucket</button>
                <button id="btn-text" onclick="setTool('text')">💬 Text</button>
                <button id="btn-eraser" onclick="setTool('eraser')">🧽 Eraser</button>
                <button onclick="clearCanvas()">🗑️ Clear</button>
            </div>

            <!-- Size Controller -->
            <div class="size-panel">
                <span id="size-label">Size: 6px</span>
                <input type="range" id="brush-size" min="1" max="40" value="6" oninput="updateWidth(this.value)">
            </div>

            <!-- Colors Grid -->
            <div class="palette">
                <div class="color-box" style="background: #000000;" onclick="setColor('#000000')"></div>
                <div class="color-box" style="background: #7f7f7f;" onclick="setColor('#7f7f7f')"></div>
                <div class="color-box" style="background: #ed1c24;" onclick="setColor('#ed1c24')"></div>
                <div class="color-box" style="background: #fff200;" onclick="setColor('#fff200')"></div>
                <div class="color-box" style="background: #22b14c;" onclick="setColor('#22b14c')"></div>
                <div class="color-box" style="background: #00a2e8;" onclick="setColor('#00a2e8')"></div>
                <div class="color-box" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
                <div class="color-box" style="background: #c3c3c3;" onclick="setColor('#c3c3c3')"></div>
                <div class="color-box" style="background: #ffaec9;" onclick="setColor('#ffaec9')"></div>
                <div class="color-box" style="background: #b5e61d;" onclick="setColor('#b5e61d')"></div>
                <div class="color-box" style="background: #3f48cc;" onclick="setColor('#3f48cc')"></div>
                <div class="color-box" style="background: #a349a4;" onclick="setColor('#a349a4')"></div>
            </div>
        </div>

        <!-- Your New PAINT2007 Logo Image -->
        <img class="app-logo" src="image_J3Wm-r.png" alt="paint2007 logo">
    </div>

    <!-- The Drawing Field -->
    <canvas id="paintCanvas" width="600" height="400"></canvas>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    let isDrawing = false;
    let tool = 'brush';
    let currentColor = '#000000';
    let currentWidth = 6;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = currentWidth;

    // Force an initial white background fill so the bucket engine can scan baseline pixels properly
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function setTool(newTool) {
        tool = newTool;
        document.getElementById('btn-brush').classList.remove('active');
        document.getElementById('btn-bucket').classList.remove('active');
        document.getElementById('btn-text').classList.remove('active');
        document.getElementById('btn-eraser').classList.remove('active');
        
        if (tool === 'brush') {
            document.getElementById('btn-brush').classList.add('active');
        } else if (tool === 'bucket') {
            document.getElementById('btn-bucket').classList.add('active');
        } else if (tool === 'text') {
            document.getElementById('btn-text').classList.add('active');
        } else if (tool === 'eraser') {
            document.getElementById('btn-eraser').classList.add('active');
        }
    }

    function setColor(newColor) {
        currentColor = newColor;
        if (tool !== 'bucket' && tool !== 'text') {
            setTool('brush');
        }
    }

    function updateWidth(newSize) {
        currentWidth = parseInt(newSize);
        document.getElementById('size-label').innerText = `Size: ${currentWidth}px`;
    }

    function clearCanvas() {
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function hexToRgba(hex) {
        let c = hex.substring(1);
        let r = parseInt(c.substring(0, 2), 16);
        let g = parseInt(c.substring(2, 4), 16);
        let b = parseInt(c.substring(4, 6), 16);
        return [r, g, b, 255];
    }

    function floodFill(startX, startY, fillHex) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        
        const targetColor = getPixelColor(startX, startY, data);
        const fillColor = hexToRgba(fillHex);

        if (colorsMatch(targetColor, fillColor)) return;

        const queue = [[startX, startY]];

        while (queue.length > 0) {
            const [x, y] = queue.shift();
            const currentIdx = (y * canvas.width + x) * 4;
            const currentColor = [data[currentIdx], data[currentIdx+1], data[currentIdx+2], data[currentIdx+3]];

            if (colorsMatch(currentColor, targetColor)) {
                data[currentIdx] = fillColor[0];
                data[currentIdx+1] = fillColor[1];
                data[currentIdx+2] = fillColor[2];
                data[currentIdx+3] = fillColor[3];

                if (x > 0) queue.push([x - 1, y]);
                if (x < canvas.width - 1) queue.push([x + 1, y]);
                if (y > 0) queue.push([x, y - 1]);
                if (y < canvas.height - 1) queue.push([x, y + 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function getPixelColor(x, y, data) {
        const idx = (y * canvas.width + x) * 4;
        return [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    }

    function colorsMatch(c1, c2) {
        // FIXED: Checks Red, Green, and Blue arrays explicitly to avoid channel mismatching
        return Math.abs(c1[0] - c2[0]) < 25 &&
               Math.abs(c1[1] - c2[1]) < 25 &&
               Math.abs(c1[2] - c2[2]) < 25;
    }

    canvas.onmousedown = function(e) {
        const rect = canvas.getBoundingClientRect();
        const startX = Math.floor(e.clientX - rect.left);
        const startY = Math.floor(e.clientY - rect.top);

        if (tool === 'bucket') {
            floodFill(startX, startY, currentColor);
        } else if (tool === 'text') {
            const userText = prompt("Enter text to stamp on canvas:");
            if (userText) {
                ctx.fillStyle = currentColor;
                const fontSize = currentWidth < 12 ? 16 : currentWidth * 1.5;
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textBaseline = "middle";
                ctx.fillText(userText, startX, startY);
            }
        } else {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
        }
    };

    canvas.onmousemove = function(e) {
        if (!isDrawing) return;

        const rect = canvas.getBoundingClientRect();const x = e.clientX - rect.left;
const y = e.clientY - rect.top;
ctx.lineTo(x, y);
if (tool === 'brush') {
ctx.strokeStyle = currentColor;
ctx.lineWidth = currentWidth;
} else if (tool === 'eraser') {
ctx.strokeStyle = '#FFFFFF';
ctx.lineWidth = currentWidth * 2;
}
ctx.stroke();
};
window.onmouseup = function() {
isDrawing = false;
ctx.closePath();
};


</script>

</body>
</html>
